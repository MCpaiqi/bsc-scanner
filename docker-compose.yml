x-runtime-env: &runtime-env
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: smms
  DATABASE_USER: postgres
  DATABASE_PASSWORD: ${SMMS_POSTGRES_PASSWORD:?Generate a private .env with scripts/init_local_env.py}
  SMMS_ANALYST_KEY: ""
  REDIS_URL: redis://redis:6379/0
  ENABLE_LIVE_TRADING: "false"

services:
  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      <<: *runtime-env
      SMMS_ANALYST_KEY: ${SMMS_ANALYST_KEY:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "smms.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  bsc-ingestion:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      <<: *runtime-env
      SMMS_INSTANCE_ID: bsc-backfill
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["python", "-m", "smms.runtime", "bsc-ingestion"]
    restart: unless-stopped

  bsc-live-tail:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      <<: *runtime-env
      SMMS_INSTANCE_ID: bsc-live-tail
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["python", "-m", "smms.runtime", "bsc-live-tail"]
    restart: unless-stopped

  radar-worker:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment: *runtime-env
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "smms.runtime", "radar-worker"]
    restart: unless-stopped

  event-relay:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment: *runtime-env
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "smms.runtime", "event-relay"]
    restart: unless-stopped

  forward-worker:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment: *runtime-env
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["python", "-m", "smms.runtime", "forward-worker"]
    restart: unless-stopped

  alpha-coverage:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment: *runtime-env
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["python", "-m", "smms.runtime", "alpha-coverage"]
    restart: unless-stopped

  research-rebuild:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment: *runtime-env
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["python", "-m", "smms.runtime", "research-rebuild"]
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB: smms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SMMS_POSTGRES_PASSWORD:?Generate a private .env with scripts/init_local_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smms"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-migrate:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment: *runtime-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
