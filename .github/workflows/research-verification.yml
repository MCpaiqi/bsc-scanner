name: Research verification

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENABLE_LIVE_TRADING: 'false'
  PYTHONUTF8: '1'
  PYTHONHASHSEED: '0'
  BSC_RPC_URL: ''
  BSC_RPC_URLS: ''
  BSC_WS_URL: ''
  BSC_WS_URLS: ''
  REDIS_URL: redis://127.0.0.1:1/0

jobs:
  backend:
    name: Backend / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: windows-2022, python: '3.13'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Verify lock inputs before installation
        run: python scripts/lock_dependencies.py check
      - name: Install locked tools and first-party code
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run backend and lint from this checkout
        run: python scripts/test.py -q --tb=short

  database:
    name: PostgreSQL, Redis and migration regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: smms_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d smms_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/smms_ci
      SMMS_RESEARCH_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/smms_ci
      SMMS_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/smms_ci
      SMMS_REDIS_TEST_URL: redis://127.0.0.1:6379/15
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: python scripts/lock_dependencies.py check
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Check fresh migration and a non-UTC database
        shell: bash
        run: |
          python -m alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ['SMMS_RESEARCH_TEST_DATABASE_URL'], isolation_level='AUTOCOMMIT')
          with engine.connect() as connection:
              connection.execute(text("ALTER DATABASE smms_ci SET timezone TO 'Asia/Hong_Kong'"))
          engine.dispose()
          PY
      - name: Run full suite with real service fixtures
        run: python scripts/test.py -q --tb=short

  frontend:
    name: Frontend / locked Node and npm graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web test -- --reporter=dot
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-${{ github.sha }}
          path: web/dist
          if-no-files-found: error

  artifacts:
    name: Source, wheel and container smoke
    needs: [backend, database, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/runtime.lock
      - run: |
          python scripts/lock_dependencies.py check
          python -m pip install --require-hashes --only-binary=:all: -r requirements/runtime.lock
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip install --no-deps dist/*.whl
          python -m pip check
          python scripts/build_release.py --output "${{ runner.temp }}/smms-release"
      - name: Build pinned runtime and web images without publishing
        run: |
          docker build --target runtime --tag smms-runtime:ci .
          docker build --target web --tag smms-web:ci .
      - name: Verify installed wheel resources and runtime inputs
        run: |
          docker run --rm --workdir /tmp smms-runtime:ci python -c "import smms; from pathlib import Path; p=Path(smms.__file__).parent; assert (p/'api/static/index.html').is_file(); a=p/'db/migrations/versions'; b=Path('/app/src/smms/db/migrations/versions'); assert {f.name:f.read_bytes() for f in a.glob('*.py')} == {f.name:f.read_bytes() for f in b.glob('*.py')}; assert (Path('/app/configs/scoring.yaml')).is_file(); assert (Path('/app/web/dist/index.html')).is_file()"
      - name: Check private Compose defaults and authenticated API through web
        shell: bash
        run: |
          network="smms-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          api="${network}-api"
          web="${network}-web"
          export SMMS_SMOKE_DIR="$(mktemp -d "${RUNNER_TEMP}/smms-ci.XXXXXXXX")"
          cleanup() {
            docker rm --force "$web" "$api" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            rm -f -- "$SMMS_SMOKE_DIR/.env" "$SMMS_SMOKE_DIR/compose.yml"
            rmdir -- "$SMMS_SMOKE_DIR"
          }
          trap cleanup EXIT
          python scripts/init_local_env.py --output "$SMMS_SMOKE_DIR/.env"
          python - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          from smms.config.settings import Settings
          from sqlalchemy.engine import make_url
          root = Path(os.environ['SMMS_SMOKE_DIR'])
          shutil.copy2('docker-compose.yml', root/'compose.yml')
          result = subprocess.run(['docker', 'compose', '--project-directory', str(root), '--env-file', str(root/'.env'),
                                   '--project-name', 'smms-ci-boundary', '-f', str(root/'compose.yml'), 'config', '--format', 'json'],
                                  capture_output=True, text=True, check=True)
          services = json.loads(result.stdout)['services']
          assert not services['postgres'].get('ports') and not services['redis'].get('ports')
          for name in ('api', 'web'):
              assert services[name]['ports'] and all(p.get('host_ip') == '127.0.0.1' for p in services[name]['ports'])
          for name, service in services.items():
              if service.get('build', {}).get('target') == 'runtime':
                  settings = Settings(_env_file=None, **service['environment'])
                  assert make_url(settings.database_url).host == 'postgres'
                  assert (settings.analyst_key is not None) == (name == 'api')
          print('Rendered Compose boundaries verified; credentials withheld.')
          PY
          docker network create "$network"
          docker run --detach --network "$network" --network-alias api --name "$api" --env-file "$SMMS_SMOKE_DIR/.env" -e REDIS_URL=redis://127.0.0.1:1/0 smms-runtime:ci
          docker run --detach --network "$network" --name "$web" -p 127.0.0.1:18080:80 smms-web:ci
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          for attempt in range(40):
              try:
                  with urlopen('http://127.0.0.1:18080/', timeout=2) as response:
                      assert b'id="root"' in response.read()
                  with urlopen('http://127.0.0.1:18080/legacy', timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, AssertionError):
                  if attempt == 39:
                      raise
                  time.sleep(.5)
          values = dict(line.split('=', 1) for line in (Path(os.environ['SMMS_SMOKE_DIR'])/'.env').read_text().splitlines()
                        if line.strip() and not line.lstrip().startswith('#'))
          credential = values['SMMS_ANALYST_KEY']
          def access(headers=None):
              with urlopen(Request('http://127.0.0.1:18080/api/radar/access', headers=headers or {}), timeout=3) as response:
                  assert response.headers['Cache-Control'] == 'no-store'
                  return json.load(response)
          assert access() == {'enabled': True, 'authorized': False}
          assert access({'Authorization': 'Bearer '+credential}) == {'enabled': True, 'authorized': True}
          for supplied, expected in ((None, 401), ('incorrect', 401), (credential, 400)):
              headers = {'Content-Type': 'application/json'}
              if supplied is not None:
                  headers['Authorization'] = 'Bearer '+supplied
              request = Request('http://127.0.0.1:18080/api/radar/annotations/bsc/not-an-address',
                                data=json.dumps({'expected_revision': 0}).encode(), method='PUT', headers=headers)
              try:
                  urlopen(request, timeout=3)
                  raise AssertionError('Invalid request unexpectedly succeeded')
              except HTTPError as error:
                  assert error.code == expected
                  assert credential not in error.read().decode()
          print('Authenticated web/API boundary verified without database writes.')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-and-wheel-${{ github.sha }}
          path: |
            dist/*.whl
            ${{ runner.temp }}/smms-release.zip
          if-no-files-found: error
